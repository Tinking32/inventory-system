services:
  - type: web
    name: inventory-system-v2
    runtime: docker
    repo: https://github.com/Tinking32/inventory-system
    branch: v2
    plan: free
    healthCheckPath: /check_health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

databases:
  - name: inventory-db
    plan: free
