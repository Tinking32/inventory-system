{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">📂 Categories</h2>
</div>

{% if error %}
<div class="alert alert-danger alert-dismissible fade show">
    {{ error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}

<div class="row">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Add Category</h5>
                <form action="/categories" method="POST" class="d-flex gap-2">
                    <input type="text" name="name" class="form-control" placeholder="Category name" required>
                    <button type="submit" class="btn btn-primary">Add</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Name</th><th>Description</th><th style="width:80px"></th></tr>
                    </thead>
                    <tbody>
                        {% for cat in categories %}
                        <tr>
                            <td>{{ cat.id }}</td>
                            <td><strong>{{ cat.name }}</strong></td>
                            <td class="text-muted">{{ cat.description or '-' }}</td>
                            <td>
                                <form action="/categories/{{ cat.id }}/delete" method="POST" onsubmit="return confirm('Delete {{ cat.name }}?');">
                                    <button class="btn btn-danger btn-sm">🗑</button>
                                </form>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="4" class="text-center text-muted py-3">No categories yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
