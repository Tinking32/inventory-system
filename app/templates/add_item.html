{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card mt-4">
            <div class="card-header bg-white py-3"><h3 class="mb-0 text-primary">📝 Add New Item</h3></div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form action="/add" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Product Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g., Wireless Keyboard">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Category</label>
                        <div class="d-flex gap-2">
                            <select name="category_id" class="form-select" style="position:relative; z-index:10;">
                                <option value="">-- None --</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                            <a href="/categories" class="btn btn-outline-secondary text-nowrap">Manage</a>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label fw-bold">Quantity</label>
                            <input type="number" name="quantity" min="0" class="form-control" required placeholder="100">
                        </div>
                        <div class="col">
                            <label class="form-label fw-bold">Unit Price ($)</label>
                            <input type="number" step="0.01" name="price" min="0" class="form-control" required placeholder="29.99">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Low Stock Threshold</label>
                        <input type="number" name="low_stock_threshold" min="0" class="form-control" value="20" placeholder="20">
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Save Item</button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
// Auto-detect category as user types product name
const KEYWORDS = {
    "Electronics": ["monitor","mouse","keyboard","battery","batteries","usb","cable","hub","charger","headphone","speaker","laptop","phone","tablet","display","webcam","printer","router","adapter","drive","ssd"],
    "Beverages": ["coke","cola","milo","coffee","water","evian","tea","juice","drink","soda","milk","beer","wine","nescafe","pepsi","sprite","fanta"],
    "Office Supplies": ["paper","pen","pencil","sticky","note","stapler","folder","binder","envelope","clip","tape","ruler","marker","notebook"],
    "Food & Snacks": ["noodle","biscuit","nuts","snack","chocolate","chips","cracker","bread","rice","cereal","candy","cookie","popcorn","granola","pasta","soup"]
};
document.querySelector('input[name="name"]').addEventListener('input', function() {
    const val = this.value.toLowerCase();
    const sel = document.querySelector('select[name="category_id"]');
    let best = null, bestScore = 0;
    for (const [cat, kws] of Object.entries(KEYWORDS)) {
        let score = 0;
        kws.forEach(kw => { if (val.includes(kw)) score += kw.length; });
        if (score > bestScore) { bestScore = score; best = cat; }
    }
    if (best) {
        for (const opt of sel.options) {
            if (opt.text === best) { sel.value = opt.value; break; }
        }
    }
});
</script>
{% endblock %}
