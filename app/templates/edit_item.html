{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card mt-4">
            <div class="card-header bg-warning bg-opacity-10 py-3"><h3 class="mb-0 text-warning">✏️ Edit Item</h3></div>
            <div class="card-body p-4">
                <p class="text-muted mb-3">Editing: <strong>{{ item.name }}</strong></p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Product Name</label>
                        <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Category</label>
                        <select name="category_id" class="form-select">
                            <option value="">-- None --</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}" {{ 'selected' if item.category_id == cat.id else '' }}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label fw-bold">Quantity</label>
                            <input type="number" name="quantity" min="0" class="form-control" value="{{ item.quantity }}" required>
                        </div>
                        <div class="col">
                            <label class="form-label fw-bold">Unit Price ($)</label>
                            <input type="number" step="0.01" name="price" min="0" class="form-control" value="{{ item.price }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Low Stock Threshold</label>
                        <input type="number" name="low_stock_threshold" min="0" class="form-control" value="{{ item.low_stock_threshold }}">
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-warning text-white">Update Item</button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
